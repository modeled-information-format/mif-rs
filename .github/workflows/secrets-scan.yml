---
name: Secrets Scan

# Thin caller of the org's central secret-scanning reusable. Replaces the
# licensed gitleaks-action (which requires a paid GITLEAKS_LICENSE for org
# repos) with the free, checksum-verified gitleaks binary + TruffleHog, and
# emits the Gitleaks SARIF to the code-scanning tab / attestation seam.

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for Secrets
    permissions:
      contents: read
      security-events: write
      actions: read
    # modeled-information-format/.github main @ c72b3fae (2026-11-24)
    uses: modeled-information-format/.github/.github/workflows/reusable-secrets.yml@c72b3fae829318990ba3da9b9d5ea0671ac5151f
