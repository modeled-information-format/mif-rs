[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = """
unmaintained transitive dependency of `gemm` (candle-core's matmul backend); \
gemm 0.19.0 is its latest release and still depends on it, so there is no \
upgrade path from within this workspace. Same advisory already ignored in \
deny.toml (cargo-deny) and audit.toml (cargo-audit).
"""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = """
`chrono` is flagged unmaintained with no fixed release (a maintenance notice, \
not a vulnerability). It cannot be removed from within this workspace: it is \
also a transitive dependency of `rmcp` and `schemars`. Same advisory ignored \
in deny.toml (cargo-deny) and security-audit.yml (cargo-audit).
"""
